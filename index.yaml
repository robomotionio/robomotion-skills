  - id: designer-skills/graphic-design
    name: graphic-design
    path: designer-skills/skills/graphic-design
    title: graphic-design
    summary: 'Master graphic-design knowledge for producing real visual assets with AI image models — blog and article covers,
      hero images, social and OG cards, ad creative, banners, icons, spot illustrations, and brand visuals. Use whenever someone
      asks you to design, create, generate, or art-direct an image, illustration, cover, banner, logo concept, or a coherent
      set of visuals; or when they hand you content (a post, a launch, a campaign) to illustrate. Covers composition, color,
      typography, brand identity, format/aspect specs, design critique, and — critically — how to write prompts and use reference
      images for the gpt-image and Gemini (Nano Banana) image toolkits so the output looks intentionally designed, not generically
      AI. Triggers: ''design a cover'', ''make a banner'', ''generate an illustration'', ''create social cards'', ''art direction'',
      ''image prompt'', ''on-brand visuals'', ''a matching set of images''.'
