# Robomotion skill deprecation and rejection ledger.
#
# Three categories:
#
# - revoked:    skills that were once published but have since been pulled
#               (security issue, policy violation found after publish, etc.).
#               install_skill.py refuses to install. List Skills flags any
#               already-installed copies as `revoked`.
#
# - deprecated: skills replaced by a successor; install still works but
#               warns and recommends the replacement.
#
# - rejected:   upstream skills the import pipeline considered and rejected.
#               Recorded for traceability so we don't re-evaluate them
#               every cron run. Never published.

revoked: []

deprecated: []

