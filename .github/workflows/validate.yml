name: validate-skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install pyyaml
      - name: Every vendored group is exactly what upstreams.yaml says
        run: python3 sync-upstream.py verify
      - name: Tripwires on what this change touches
        run: |
          git fetch -q origin main
          python3 scan-skills.py --changed origin/main
      - name: Validate skill contract
        run: bash validate.sh
      - name: Check index.json is up to date
        run: python3 build-index.py --check
